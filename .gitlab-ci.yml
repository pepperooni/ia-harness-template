stages:
  - deploy

packmind-update:
  stage: deploy
  image: node:22.17.0
  timeout: 15 minutes
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - npm install -g @packmind/cli
    - packmind-cli whoami
    - |
      CHANGED=$(git diff --name-only HEAD~1 HEAD -- \
        CLAUDE.md \
        .claude/standards/ \
        .claude/skills/ \
        .claude/commands/ \
        .packmind/ \
        packmind.json \
        scripts/)
    - |
      if [ -z "$CHANGED" ]; then
        echo "Aucun fichier Packmind modifié, job ignoré."
        exit 0
      fi
    - echo "Fichiers modifiés :" && echo "$CHANGED"
    - |
      for f in $CHANGED; do
        packmind-cli playbook add "$f"
      done
    - packmind-cli playbook status
    - |
      packmind-cli playbook submit \
        -m "ci: mise à jour ia-harness — $CI_COMMIT_SHORT_SHA ($CI_COMMIT_TITLE)"
